services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4323}
    depends_on:
      db:
        condition: service_healthy

  api-dev:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${PORT_DEV:-8001}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      CORS_ORIGINS: http://localhost:4323,http://localhost:4321
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4323}:80"
    depends_on:
      - api

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4323}:4323"
    environment:
      - HOST=0.0.0.0
      - PORT=4323
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8001/api/v1}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.astro
    depends_on:
      - api-dev
    profiles:
      - dev

volumes:
  pgdata:
