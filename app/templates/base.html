<!DOCTYPE html>
<html lang="es" class="h-full bg-black">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xperience – Detailing de ultra alta gama.">

    <title>{% block title %}Xperience{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    {% block head %}{% endblock %}
</head>

<body
    class="h-full bg-black text-white antialiased font-sans flex flex-col selection:bg-neutral-800 selection:text-white">


    <header class="w-full bg-black/80 backdrop-blur-md fixed top-0 left-0 right-0 z-50 border-b border-neutral-900/50 transition-all duration-300">
        <div class="mx-auto max-w-7xl px-8 h-24 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold tracking-tight text-white hover:opacity-90 transition-opacity">
                Xperience<span class="text-blue-600">.</span>
            </a>

            <nav class="hidden md:flex items-center gap-10">
                <a href="#servicios"
                    class="text-sm font-medium text-neutral-400 hover:text-white transition-colors duration-200">Servicios</a>
                <a href="#galeria"
                    class="text-sm font-medium text-neutral-400 hover:text-white transition-colors duration-200">Galería</a>
                <a href="#reserva"
                    class="text-sm font-medium text-neutral-400 hover:text-white transition-colors duration-200">Reserva</a>
            </nav>

            <div>
                <a href="#reserva"
                    class="bg-white text-black font-semibold text-sm px-6 py-2.5 rounded-full hover:bg-neutral-200 transition-all duration-200">
                    Agendar Turno
                </a>
            </div>
        </div>
    </header>
    <main class="flex-grow flex flex-col justify-center pt-24">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-black border-t border-neutral-900 py-10 text-neutral-600">
        <div class="mx-auto max-w-7xl px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
            <p>&copy; {{ now().year if now is defined else "2026" }} Xperience. Detailing de ultra alta gama.</p>
            <div class="flex gap-6">
                <a href="#" class="hover:text-neutral-400 transition-colors">Términos</a>
                <a href="#" class="hover:text-neutral-400 transition-colors">Privacidad</a>
                <a href="#" class="hover:text-neutral-400 transition-colors">Contacto</a>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
