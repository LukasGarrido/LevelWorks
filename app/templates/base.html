<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0E1418]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xperience – Detailing de ultra alta gama.">
    <meta name="theme-color" content="#0E1418">

    <title>{% block title %}Xperience{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        crest: '#B7222A',
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Porsche-style underline link */
        .link-arrow {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .link-arrow::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            height: 1px;
            width: 0%;
            background: currentColor;
            transition: width 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        .link-arrow:hover::after {
            width: 100%;
        }

        .link-arrow svg {
            transition: transform 0.35s cubic-bezier(.4, 0, .2, 1);
        }

        .link-arrow:hover svg {
            transform: translateX(4px);
        }

        #site-header.is-scrolled {
            background-color: rgba(14, 20, 24, 0.85);
            backdrop-filter: blur(14px);
            border-bottom-color: rgba(255, 255, 255, 0.08);
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body
    class="h-full bg-[#0E1418] text-[#F4F4F2] antialiased font-sans flex flex-col selection:bg-[#B7222A] selection:text-white">

    <header id="site-header"
        class="w-full fixed top-0 left-0 right-0 z-50 border-b border-transparent transition-all duration-500">
        <div class="mx-auto max-w-7xl px-8 h-20 grid grid-cols-3 items-center">

            <div class="relative justify-self-start" id="menu-wrapper">
                <button id="menu-toggle" onclick="toggleMenu()" aria-expanded="false" aria-label="Abrir menú"
                    class="flex items-center gap-3 text-white/70 hover:text-white transition-colors duration-300">
                    <span class="relative w-5 h-4 flex flex-col justify-between">
                        <span class="menu-line block h-[1.5px] w-full bg-current transition-all duration-300"></span>
                        <span class="menu-line block h-[1.5px] w-full bg-current transition-all duration-300"></span>
                        <span class="menu-line block h-[1.5px] w-full bg-current transition-all duration-300"></span>
                    </span>
                    <span class="hidden sm:inline text-[11px] font-medium tracking-[0.2em] uppercase">Menú</span>
                </button>

                <div id="menu-dropdown"
                    class="hidden absolute top-full left-0 mt-4 w-52 rounded-lg border border-white/10 bg-[#0E1418]/95 backdrop-blur-xl py-2 shadow-2xl shadow-black/50">
                    <a href="#servicios" onclick="closeMenu()"
                        class="block px-5 py-3 text-[11px] font-medium tracking-[0.15em] uppercase text-white/70 hover:text-white hover:bg-white/[0.04] transition-colors duration-200">Servicios</a>
                    <a href="#galeria" onclick="closeMenu()"
                        class="block px-5 py-3 text-[11px] font-medium tracking-[0.15em] uppercase text-white/70 hover:text-white hover:bg-white/[0.04] transition-colors duration-200">Galería</a>
                    <a href="#reserva" onclick="closeMenu()"
                        class="block px-5 py-3 text-[11px] font-medium tracking-[0.15em] uppercase text-white/70 hover:text-white hover:bg-white/[0.04] transition-colors duration-200">Reserva</a>
                </div>
            </div>

            <a href="/" class="flex items-center gap-2.5 group justify-self-center">
                <span class="w-1.5 h-1.5 rounded-full bg-[#B7222A]"></span>
                <span class="text-lg font-light tracking-[0.3em] uppercase text-white">Xperience</span>
            </a>

        </div>
    </header>

    <main class="flex-grow flex flex-col justify-center">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-[#0E1418] border-t border-white/[0.06] py-10 text-white/40">
        <div
            class="mx-auto max-w-7xl px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] tracking-[0.1em] uppercase">
            <p>&copy; {{ now().year if now is defined else "2026" }} Xperience — Detailing de ultra alta gama.</p>
            <div class="flex gap-8">
                <a href="#" class="hover:text-white transition-colors duration-300">Términos</a>
                <a href="#" class="hover:text-white transition-colors duration-300">Privacidad</a>
                <a href="#" class="hover:text-white transition-colors duration-300">Contacto</a>
            </div>
        </div>
    </footer>

    <script>
            (function () {
                const header = document.getElementById('site-header');
                const onScroll = () => {
                    if (window.scrollY > 40) header.classList.add('is-scrolled');
                    else header.classList.remove('is-scrolled');
                };
                document.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
            })();

        function toggleMenu() {
            const dropdown = document.getElementById('menu-dropdown');
            const toggle = document.getElementById('menu-toggle');
            const isOpen = !dropdown.classList.contains('hidden');
            if (isOpen) {
                dropdown.classList.add('hidden');
                toggle.setAttribute('aria-expanded', 'false');
            } else {
                dropdown.classList.remove('hidden');
                toggle.setAttribute('aria-expanded', 'true');
            }
        }

        function closeMenu() {
            document.getElementById('menu-dropdown').classList.add('hidden');
            document.getElementById('menu-toggle').setAttribute('aria-expanded', 'false');
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.getElementById('menu-wrapper');
            if (wrapper && !wrapper.contains(e.target)) closeMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeMenu();
        });
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
