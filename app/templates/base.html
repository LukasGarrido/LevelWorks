<!DOCTYPE html>
<html lang="es" class="h-full bg-white">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xperience – Detailing de ultra alta gama.">
    <meta name="theme-color" content="#ffffff">

    <title>{% block title %}Xperience{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf4f0',
                            100: '#fbe8de',
                            200: '#f6d1bf',
                            300: '#f0ae92',
                            400: '#e6825c',
                            500: '#de5e35',
                            600: '#cf4620',
                            700: '#ac351a',
                            800: '#892c1a',
                            900: '#6f2619',
                            DEFAULT: '#f15a24' // El naranja del diseño
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Estilo general del scrollbar de la página */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f3f4f6;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* Transiciones suaves */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body class="h-full bg-white text-neutral-800 antialiased font-sans flex flex-col selection:bg-brand selection:text-white">

    <!-- HEADER (Basado en home.png) -->
    <header class="w-full bg-white border-b border-neutral-100 sticky top-0 z-50">
        <div class="mx-auto max-w-7xl px-6 md:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo: Xperience. -->
            <a href="/" class="flex items-center gap-1 group">
                <span class="text-xl font-bold tracking-tight text-neutral-900">Xperience<span class="text-brand">.</span></span>
            </a>

            <!-- Navigation and Actions -->
            <div class="flex items-center gap-8">
                <!-- Navigation links -->
                <nav class="hidden md:flex items-center gap-6">
                    <a href="/" class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">Inicio</a>
                    <a href="/servicios" class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">Servicios</a>
                    <a href="/reservas" class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">Reservar</a>
                    <a href="/admin" class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">/admin</a>
                </nav>

                <!-- Action Button: Agendar cita -->
                <a href="/reservas" class="bg-brand text-white font-semibold text-xs tracking-wider uppercase px-5 py-3 rounded-full hover:bg-brand-600 transition-all duration-200 shadow-sm shadow-brand/10">
                    Agendar cita
                </a>
            </div>

        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER (Basado en home.png) -->
    <footer class="bg-white border-t border-neutral-100 py-8 text-neutral-400 text-xs">
        <div class="mx-auto max-w-7xl px-6 md:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 Xperience Car Care</p>
            <div class="flex items-center gap-2">
                <!-- Icono de reloj simple -->
                <svg class="w-4 h-4 text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Lun a Sáb - 09:00 - 18:30</span>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
