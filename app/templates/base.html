<!DOCTYPE html>
<html lang="es" class="h-full bg-white">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Level Works – Detailing.">
    <meta name="theme-color" content="#ffffff">

    <title>{% block title %}Level Works{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf4f0',
                            100: '#fbe8de',
                            200: '#f6d1bf',
                            300: '#f0ae92',
                            400: '#e6825c',
                            500: '#de5e35',
                            600: '#cf4620',
                            700: '#ac351a',
                            800: '#892c1a',
                            900: '#6f2619',
                            DEFAULT: '#f15a24' // El naranja del diseño
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Estilo general del scrollbar de la página */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f3f4f6;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* Transiciones suaves */
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal animations */
        .modal-backdrop-fade {
            animation: backdropFadeIn 0.2s ease-out forwards;
        }

        .modal-card-enter {
            animation: cardSlideIn 0.25s ease-out forwards;
        }

        @keyframes backdropFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(12px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body
    class="h-full bg-white text-neutral-800 antialiased font-sans flex flex-col selection:bg-brand selection:text-white">

    <!-- HEADER (Basado en home.png) -->
    <header class="w-full bg-white border-b border-neutral-100 sticky top-0 z-50">
        <div class="mx-auto max-w-7xl px-6 md:px-8 h-20 flex items-center justify-between">

            <!-- Logo: Level Works. -->
            <a href="/" class="flex items-center gap-1 group">
                <span class="text-xl font-bold tracking-tight text-neutral-900">Level Works</span>
            </a>

            <!-- Navigation and Actions -->
            <div class="flex items-center gap-8">
                <!-- Navigation links -->
                <nav class="hidden md:flex items-center gap-6">
                    <a href="/"
                        class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">Inicio</a>
                    <a href="/servicios"
                        class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">Servicios</a>
                    <a href="/reservas"
                        class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200">Reservar</a>
                    <button onclick="document.getElementById('contactModal').classList.remove('hidden')" type="button"
                        class="text-sm font-medium text-neutral-500 hover:text-neutral-900 transition-colors duration-200 cursor-pointer">Contacto</button>
                </nav>

            </div>

        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- CONTACT MODAL -->
    <div id="contactModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4"
        onclick="if(event.target===this) this.classList.add('hidden')">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-neutral-900/40 backdrop-blur-sm modal-backdrop-fade"></div>

        <!-- Modal Card -->
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden modal-card-enter">
            <!-- Header con acento brand -->
            <div class="bg-gradient-to-r from-brand to-brand-600 px-6 py-5">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-white">Contáctanos</h2>
                    <button onclick="document.getElementById('contactModal').classList.add('hidden')"
                        class="text-white/70 hover:text-white transition-colors duration-150 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <p class="text-white/80 text-xs mt-1">Estamos para atenderte</p>
            </div>

            <!-- Body -->
            <div class="px-6 py-5 flex flex-col gap-4">

                <!-- WhatsApp -->
                <a href="https://wa.me/{{ settings.CONTACT_PHONE.replace('+', '').replace(' ', '') }}" target="_blank"
                    class="flex items-center gap-4 p-3 rounded-xl bg-brand-50/60 hover:bg-brand-50 transition-colors duration-200 group">
                    <div class="w-10 h-10 rounded-full bg-brand/10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-brand" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z" />
                            <path
                                d="M12 0C5.373 0 0 5.373 0 12c0 2.625.846 5.059 2.284 7.034L.789 23.492a.5.5 0 00.611.611l4.458-1.495A11.96 11.96 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-2.387 0-4.607-.798-6.375-2.144l-.447-.338-2.87.962.962-2.87-.338-.447A9.953 9.953 0 012 12C2 6.486 6.486 2 12 2s10 4.486 10 10-4.486 10-10 10z" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-neutral-400 font-medium">WhatsApp</p>
                        <p class="text-sm font-semibold text-neutral-800 group-hover:text-brand transition-colors">
                            {{ settings.CONTACT_PHONE }}</p>
                    </div>
                </a>

                <!-- Instagram -->
                <a href="{{ settings.INSTAGRAM_HANDLE }}" target="_blank"
                    class="flex items-center gap-4 p-3 rounded-xl bg-brand-50/60 hover:bg-brand-50 transition-colors duration-200 group">
                    <div class="w-10 h-10 rounded-full bg-brand/10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-brand" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-neutral-400 font-medium">Instagram</p>
                        <p class="text-sm font-semibold text-neutral-800">LevelWorks</p>
                    </div>
                </a>

                <!-- Email -->
                <a href="mailto:{{ settings.CONTACT_EMAIL }}"
                    class="flex items-center gap-4 p-3 rounded-xl bg-brand-50/60 hover:bg-brand-50 transition-colors duration-200 group">
                    <div class="w-10 h-10 rounded-full bg-brand/10 flex items-center justify-center flex-shrink-0">
                        <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs text-neutral-400 font-medium">Email</p>
                        <p class="text-sm font-semibold text-neutral-800 group-hover:text-brand transition-colors">
                            {{ settings.CONTACT_EMAIL }}</p>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- FOOTER (Basado en home.png) -->
    <footer class="bg-white border-t border-neutral-100 py-8 text-neutral-400 text-xs">
        <div class="mx-auto max-w-7xl px-6 md:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 Level Works </p>

        </div>
    </footer>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                document.getElementById('contactModal').classList.add('hidden');
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
