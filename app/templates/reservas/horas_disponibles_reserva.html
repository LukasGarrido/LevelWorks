<!-- HOURS LIST FRAGMENT (HTMX) -->
<div class="fade-in flex flex-col gap-5 w-full">
    
    <!-- Section Title: Horarios · sábado, 22 de agosto -->
    <h3 class="text-sm font-bold text-neutral-800 border-b border-neutral-100 pb-3">
        Horarios · {{ fecha_formateada }}
    </h3>

    <!-- Slots Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {% for slot in slots %}
            {% if slot.is_occupied %}
                <!-- Occupied (Atenuado / Disabled) -->
                <button type="button" disabled 
                        class="py-3 px-2 text-center text-xs font-semibold text-neutral-300 bg-neutral-50 border border-neutral-100 rounded-xl cursor-not-allowed line-through decoration-neutral-200">
                    {{ slot.hora }}
                </button>
            {% else %}
                <!-- Available Slot -->
                <button type="button" 
                        onclick="selectHour(this, '{{ slot.hora }}')"
                        class="hour-slot-btn py-3 px-2 text-center text-xs font-bold text-neutral-700 bg-white border border-neutral-200 rounded-xl hover:border-neutral-300 hover:bg-neutral-50 transition-all duration-200">
                    {{ slot.hora }}
                </button>
            {% endif %}
        {% endfor %}
    </div>

    <!-- Help caption -->
    <p class="text-[10px] text-neutral-400 font-medium italic mt-2">
        * Los horarios atenuados ya están reservados.
    </p>

</div>
