<!-- STEP 3 FRAGMENT (HTMX) -->
<form hx-post="/reservas/confirmar" hx-target="#booking-wizard-container" hx-swap="innerHTML" class="fade-in flex flex-col gap-8">
    
    <!-- Hidden fields from previous steps -->
    <input type="hidden" name="servicio_id" value="{{ servicio_id }}">
    <input type="hidden" name="fecha" value="{{ fecha }}">
    <input type="hidden" name="hora" value="{{ hora }}">

    <!-- Form container -->
    <div class="rounded-2xl border border-neutral-200/60 p-6 md:p-8 bg-white flex flex-col gap-6">
        
        <!-- Two-column row: Nombre and Email -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
                <label for="nombre" class="text-xs font-bold text-neutral-700 tracking-wide">Nombre completo</label>
                <input type="text" name="nombre" id="nombre" required placeholder="María Fuentes"
                       class="w-full bg-white border border-neutral-200 rounded-xl px-4 py-3 text-sm text-neutral-800 placeholder:text-neutral-300 hover:border-neutral-300 focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all duration-200">
            </div>
            
            <div class="flex flex-col gap-2">
                <label for="email" class="text-xs font-bold text-neutral-700 tracking-wide">Email</label>
                <input type="email" name="email" id="email" required placeholder="maria@mail.com"
                       class="w-full bg-white border border-neutral-200 rounded-xl px-4 py-3 text-sm text-neutral-800 placeholder:text-neutral-300 hover:border-neutral-300 focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all duration-200">
            </div>
        </div>

        <!-- Two-column row: Telefono and Vehiculo -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
                <label for="telefono" class="text-xs font-bold text-neutral-700 tracking-wide">Teléfono</label>
                <input type="tel" name="telefono" id="telefono" required placeholder="+56 9 1234 5678"
                       class="w-full bg-white border border-neutral-200 rounded-xl px-4 py-3 text-sm text-neutral-800 placeholder:text-neutral-300 hover:border-neutral-300 focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all duration-200">
            </div>
            
            <div class="flex flex-col gap-2">
                <label for="vehiculo" class="text-xs font-bold text-neutral-700 tracking-wide">Vehículo</label>
                <input type="text" name="vehiculo" id="vehiculo" required placeholder="Mazda 3 - Blanco"
                       class="w-full bg-white border border-neutral-200 rounded-xl px-4 py-3 text-sm text-neutral-800 placeholder:text-neutral-300 hover:border-neutral-300 focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all duration-200">
            </div>
        </div>

        <!-- Row: Notas (opcional) -->
        <div class="flex flex-col gap-2">
            <label for="notas" class="text-xs font-bold text-neutral-700 tracking-wide">Notas (opcional)</label>
            <textarea name="notas" id="notas" rows="4" placeholder="Manchas en tapiz trasero, llego 10 min antes..."
                      class="w-full bg-white border border-neutral-200 rounded-xl px-4 py-3 text-sm text-neutral-800 placeholder:text-neutral-300 hover:border-neutral-300 focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none transition-all duration-200 resize-none"></textarea>
        </div>

    </div>

    <!-- Bottom Bar Actions -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-neutral-100 pt-6 mt-4">
        <!-- Back button to Paso 2 -->
        <button type="button" 
                hx-get="/reservas/paso2?servicio_id={{ servicio_id }}"
                hx-target="#booking-wizard-container"
                hx-swap="innerHTML"
                class="inline-flex items-center gap-1 text-neutral-500 hover:text-neutral-800 font-bold text-xs tracking-wider uppercase transition-colors duration-200 self-start sm:self-auto py-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Atrás
        </button>

        <!-- Selected Service Name, Date, Hour, Cost summary -->
        <span class="text-xs font-bold text-neutral-700 text-center flex flex-col items-center">
            <span>{{ servicio.name }} · ${{ "{:,.0f}".format(servicio.price).replace(",", ".") }}</span>
            <span class="text-[10px] text-neutral-400 font-medium font-normal mt-0.5">{{ fecha_formateada }} a las {{ hora }}</span>
        </span>

        <!-- Confirm Button -->
        <button type="submit" 
                class="bg-brand text-white font-bold text-xs tracking-wider uppercase px-8 py-4 rounded-full hover:bg-brand-600 transition-all duration-200 w-full sm:w-auto">
            Confirmar reserva
        </button>
    </div>
</form>

<!-- PROGRESS BAR UPDATE (OOB SWAP) -->
<div id="wizard-progress-bar" hx-swap-oob="true" class="w-full">
    <div class="grid grid-cols-4 gap-4 border-b border-neutral-100 pb-3">
        <!-- Step 1 (Finished) -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[10px] sm:text-xs font-bold text-neutral-900">1. Servicio</span>
            <div class="h-1 rounded-full bg-brand"></div>
        </div>
        <!-- Step 2 (Finished) -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[10px] sm:text-xs font-bold text-neutral-900">2. Fecha y hora</span>
            <div class="h-1 rounded-full bg-brand"></div>
        </div>
        <!-- Step 3 (Active) -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[10px] sm:text-xs font-bold text-brand">3. Tus datos</span>
            <div class="h-1 rounded-full bg-brand"></div>
        </div>
        <!-- Step 4 (Pending) -->
        <div class="flex flex-col gap-1.5">
            <span class="text-[10px] sm:text-xs font-medium text-neutral-400">4. Confirmación</span>
            <div class="h-1 rounded-full bg-neutral-100"></div>
        </div>
    </div>
</div>
