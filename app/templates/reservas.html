{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="fade-in max-w-4xl mx-auto px-6 py-12 md:py-16 flex flex-col gap-10 md:gap-12">

    <!-- Title and Subtitle -->
    <div class="flex flex-col gap-2">
        <h1 class="text-3xl font-extrabold tracking-tight text-neutral-900">
            Reserva tu cita
        </h1>
        <p class="text-neutral-500 text-sm">
            Cuatro pasos simples y listo. Te confirmamos por email.
        </p>
    </div>

    <!-- PROGRESS BAR WIDGET (OOB TARGET) -->
    <div id="wizard-progress-bar" class="w-full">
        <!-- Progress Steps -->
        <div class="grid grid-cols-4 gap-4 border-b border-neutral-100 pb-3">
            <!-- Step 1 Indicator -->
            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] sm:text-xs font-bold transition-all duration-300 {% if initial_step == 1 %}text-brand{% else %}text-neutral-900{% endif %}">1. Servicio</span>
                <div class="h-1 rounded-full transition-all duration-300 {% if initial_step >= 1 %}bg-brand{% else %}bg-neutral-100{% endif %}"></div>
            </div>
            <!-- Step 2 Indicator -->
            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] sm:text-xs font-bold transition-all duration-300 {% if initial_step == 2 %}text-brand{% else %}text-neutral-400{% endif %}">2. Fecha y hora</span>
                <div class="h-1 rounded-full transition-all duration-300 {% if initial_step >= 2 %}bg-brand{% else %}bg-neutral-100{% endif %}"></div>
            </div>
            <!-- Step 3 Indicator -->
            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] sm:text-xs font-medium transition-all duration-300 text-neutral-400">3. Tus datos</span>
                <div class="h-1 rounded-full bg-neutral-100"></div>
            </div>
            <!-- Step 4 Indicator -->
            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] sm:text-xs font-medium transition-all duration-300 text-neutral-400">4. Confirmación</span>
                <div class="h-1 rounded-full bg-neutral-100"></div>
            </div>
        </div>
    </div>

    <!-- DYNAMIC STEP CONTAINER -->
    <div id="booking-wizard-container" 
         class="w-full min-h-[400px] flex flex-col justify-center"
         hx-get="{% if initial_step == 2 %}/reservas/paso2?servicio_id={{ selected_servicio_id }}{% else %}/reservas/paso1{% endif %}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <!-- Loader animation -->
        <div class="flex flex-col items-center gap-3 py-20 text-neutral-400">
            <svg class="animate-spin w-8 h-8 text-brand" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xs font-medium tracking-wide">Cargando asistente...</span>
        </div>
    </div>

</div>
{% endblock %}
