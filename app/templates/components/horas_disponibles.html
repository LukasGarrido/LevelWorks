<!-- ================================================================= -->
<!-- Fragmento HTMX: Horas disponibles para la fecha seleccionada      -->
<!-- Se renderiza dentro de #horas-container en index.html              -->
<!-- ================================================================= -->

{% if horas %}
<label class="block text-sm font-medium text-gray-700 mb-2">
    Horas disponibles para {{ fecha }}
</label>
<div class="grid grid-cols-3 gap-2">
    {% for hora in horas %}
    <button type="button"
            class="rounded-lg border border-indigo-300 px-3 py-2 text-sm text-indigo-700
                   hover:bg-indigo-600 hover:text-white transition-colors
                   focus:outline-none focus:ring-2 focus:ring-indigo-500"
            onclick="this.closest('form').querySelector('[name=hora]').value='{{ hora }}'">
        {{ hora }}
    </button>
    {% endfor %}
</div>
<input type="hidden" name="hora" value="">
{% else %}
<p class="text-sm text-red-500">No hay horas disponibles para {{ fecha }}.</p>
{% endif %}
