<!-- ================================================================= -->
<!-- Fragmento HTMX: Horas disponibles para la fecha seleccionada      -->
<!-- Se renderiza dentro de #horas-container en index.html              -->
<!-- ================================================================= -->

{% if horas %}
<div class="flex flex-wrap gap-3">
    {% for hora in horas %}
    <button type="button"
            class="hora-btn rounded-xl border border-neutral-800 bg-neutral-900 px-5 py-3 text-sm font-medium text-neutral-300
                   hover:border-neutral-600 hover:text-white transition-all duration-200
                   focus:outline-none"
            onclick="selectHora(this, '{{ hora }}')">
        {{ hora }}
    </button>
    {% endfor %}
</div>
<input type="hidden" name="hora" id="hora-input" value="">
<script>
    function selectHora(btn, hora) {
        document.querySelectorAll('.hora-btn').forEach(b => {
            b.classList.remove('border-blue-600', 'bg-blue-600/10', 'text-white');
            b.classList.add('border-neutral-800', 'bg-neutral-900', 'text-neutral-300');
        });
        btn.classList.remove('border-neutral-800', 'bg-neutral-900', 'text-neutral-300');
        btn.classList.add('border-blue-600', 'bg-blue-600/10', 'text-white');
        document.getElementById('hora-input').value = hora;
    }
</script>
{% else %}
<p class="text-neutral-500 text-sm">No hay horarios disponibles para esta fecha.</p>
{% endif %}
